# SyncTrace Experiment Runner — grid of hyperparameters
# GPU strategy: self-hosted runner with a CUDA GPU if available; otherwise
# the engine auto-falls-back to CPU (train.py handles device detection).
# Trigger manually from the Actions tab or from a PR comment (workflow_dispatch).
name: Experiment

on:
  workflow_dispatch:
    inputs:
      grid:
        description: "JSON grid, e.g. {\"embed_dim\":[128,256],\"margin\":[0.3,0.5]}"
        required: false
        default: '{"embed_dim":[256],"margin":[0.3]}'
      epochs:
        description: "Training epochs"
        required: false
        default: "25"

jobs:
  run-experiment:
    runs-on: ${{ (inputs.epochs != '25' && 'ubuntu-latest') || 'self-hosted' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Detect GPU availability
        id: gpu
        run: |
          if command -v nvidia-smi >/dev/null && nvidia-smi >/dev/null 2>&1; then
            echo "device=cuda" >> "$GITHUB_OUTPUT"
            echo "GPU runner available"
          else
            echo "device=cpu" >> "$GITHUB_OUTPUT"
            echo "WARNING: no GPU detected, experiments will run on CPU (slower but correct)"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # CPU torch on non-GPU runners (index URL for CPU wheels)
          if [ "${{ steps.gpu.outputs.device }}" = "cpu" ]; then
            pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 \
              --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install ruff pytest

      - name: Expand grid and run experiments
        id: grid
        run: |
          python - <<'EOF'
          import json, itertools, subprocess, os, sys

          grid = json.loads('${{ github.event.inputs.grid }}')
          epochs = '${{ github.event.inputs.epochs }}'
          device = '${{ steps.gpu.outputs.device }}'
          keys, values = grid.keys(), grid.values()
          results = []
          for combo in itertools.product(*values):
              cfg = dict(zip(keys, combo))
              run_id = "_".join(f"{k}{v}" for k, v in cfg.items())
              cmd = [sys.executable, "-m", "src.engine.train",
                     "--config", "config/train.yaml",
                     "--epochs", epochs, "--device", device]
              for k, v in cfg.items():
                  cmd += [f"--{k}", str(v)]
              log = f"experiments/run_{run_id}.log"
              os.makedirs("experiments", exist_ok=True)
              r = subprocess.run(cmd, capture_output=True, text=True)
              open(log, "w").write(r.stdout + r.stderr)
              metrics = {}
              for l in r.stdout.splitlines():
                  if l.startswith("METRIC "):
                      head, _, val = l[7:].partition("=")
                      metrics[head.strip()] = val.strip()
              if r.returncode != 0:
                  metrics["status"] = "FAILED"
              results.append({"run": run_id, "metrics": metrics})
          json.dump(results, open("experiments/last_grid_results.json", "w"), indent=2)
          print(json.dumps({"runs": len(results)}))
          EOF

      - name: Comment PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const res = JSON.parse(fs.readFileSync('experiments/last_grid_results.json'));
            const body = res.runs.map(r => `Run \`${r.run}\`\n` +
              Object.entries(r.metrics).map(([k, v]) => `- ${k}: ${v}`).join('\n')
            ).join('\n---\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner,
              repo: context.repo.repo, body: '### Experiment grid results\n' + body
            });

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/
