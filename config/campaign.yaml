# Official campaign configuration. Do not report metrics until licensed data is available.
campaign_name: synctrace_official_v1
seeds: [42, 52, 62]
splits:
  train: 0.70
  val: 0.15
  test: 0.15
model:
  embed_dim: 256
  projection_dim: 128
  stem_embed: 128
  num_mamba_blocks: 2
  d_state: 16
  keep_ratio: 0.5
  num_frames: 16
  frame_size: 112
contrastive:
  base_margin: 0.3
  max_margin: 1.2
  severity_weight: 0.5
  attribution_weight: 0.25
training:
  epochs: 25
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  mixed_precision: true
  checkpoint_metric: val_loss
data:
  benchmark: fakeavceleb
  root: /data/fakeavceleb
  sample_rate: 16000
  max_frames: 16
  generator:
    backend: mediapipe
    seed: 42
    severities: [0.2, 0.4, 0.6, 0.8]
    regions: [lips, lower_face, full_face]
    manipulate_frames_ratio: 0.6
baselines:
  - name: audio_video_xception
    protocol: matched_16_frame_logmel
  - name: cnn_lstm_transformer
    protocol: matched_16_frame_logmel
  - name: cross_modal_transformer
    protocol: matched_16_frame_logmel
ablations:
  - full
  - fixed_severity
  - no_mamba
  - dense_attention
  - no_sae
